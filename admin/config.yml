backend:
  name: github
  repo: fdeleo115/ghpls-website
  branch: main
  # GitHub login is handled by this site's own Cloudflare Pages Functions
  # (functions/api/auth.js + functions/api/callback.js). No third-party server.
  base_url: https://ghpls.fdeleo115.workers.dev
  auth_endpoint: api/auth

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "achievements"
    label: "Achievements"
    label_singular: "Achievement"
    description: "Add or edit competition results here."
    folder: "src/achievements"
    create: true
    identifier_field: "competition"
    slug: "{{competition}}-{{year}}"
    extension: "md"
    fields:
      - { label: "Competition Name", name: "competition", widget: "string", hint: "e.g. HSFK Cup, Centre Block Cup" }
      - { label: "Year", name: "year", widget: "number", value_type: "int" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "When this happened. Newest results show first on the page." }
      - label: "Results"
        name: "results"
        widget: "list"
        hint: "Add each award won at this competition"
        fields:
          - { label: "Award", name: "award", widget: "string", hint: "e.g. Finalists, Semi-Finalists, Best Oral Advocate" }
          - { label: "Recipients", name: "recipients", widget: "string", hint: "e.g. Kate Hilton & Ava Gonsalves" }
          - label: "Counts As"
            name: "type"
            widget: "select"
            required: false
            hint: "Which heading this shows under on each recipient's profile page. Leave on Decide automatically unless it guesses wrong — anything that reads like a round (Champions, Finalists, Semi-Finalists) becomes a Team Placement, and everything else becomes an Individual Achievement."
            options:
              - { label: "Decide automatically", value: "auto" }
              - { label: "Team Placement — how far the team got", value: "placement" }
              - { label: "Individual Achievement — a named award", value: "award" }
      - label: "Competitors"
        name: "competitors"
        widget: "list"
        required: false
        hint: "Everyone who competed at this event, including teammates who didn't place. Results above already show who won what."
        fields:
          - { label: "Name", name: "name", widget: "string" }
      - { label: "Location", name: "location", widget: "string", required: false, hint: "Where this competition took place, e.g. Gowling WLG Moot Court" }
      - { label: "Host", name: "host", widget: "string", required: false, hint: "The school or society hosting the competition" }
      - { label: "Case Title", name: "caseTitle", widget: "string", required: false, hint: "The case argued at this competition" }
      - { label: "Case Summary", name: "caseSummary", widget: "text", required: false, hint: "A short description of the case" }
      - label: "Card Width"
        name: "cardWidth"
        widget: "select"
        required: false
        default: "normal"
        hint: "Make a card span the full row (good for ones with lots of results)"
        options:
          - { label: "Normal (half row)", value: "normal" }
          - { label: "Wide (full row)", value: "wide" }
      - { label: "Photo", name: "photo", widget: "image", required: false, hint: "Upload a photo from this competition" }
      - label: "Photo Fit"
        name: "photoSize"
        widget: "select"
        required: false
        default: "cover"
        hint: "Fill area (crop) or show the entire photo (may leave gaps)"
        options:
          - { label: "Fill area (crop to fit)", value: "cover" }
          - { label: "Show entire photo (may have gaps)", value: "contain" }
      - label: "Photo Height"
        name: "photoHeight"
        widget: "select"
        required: false
        default: "medium"
        hint: "How tall the photo area is on the card"
        options:
          - { label: "Short", value: "short" }
          - { label: "Medium", value: "medium" }
          - { label: "Tall", value: "tall" }
      - { label: "Photo Zoom", name: "photoZoom", widget: "number", required: false, default: 1, value_type: "float", min: 1, max: 3, step: 0.1, hint: "1 = no zoom, 2 = zoom in 2x. Use with focus below to frame the shot." }
      - label: "Photo Focus (drag to position)"
        name: "photoPosition"
        widget: "focal-point"
        required: false
        default: "center"
        image_field: "photo"
        fitField: "photoSize"
        zoomField: "photoZoom"
        # Says "previews", never "the preview on the right": the panels sit
        # beside the photo on a desktop but below it on a phone.
        hint: "Drag the dot to choose what part of the photo stays in view. The “How it looks on the site” previews show every place this photo appears."
        shapes:
          - label: "Achievements list card"
            axes:
              - { by: "cardWidth", values: { normal: 564, wide: 1152 }, default: 564 }
              - { by: "photoHeight", values: { short: 140, medium: 200, tall: 280 }, default: 200 }
          - label: "Detail page banner"
            axes: [{ value: 1600 }, { value: 380 }]
            overlay: "navy"
            approx: true
          - label: "Detail page gallery thumbnail"
            axes: [{ value: 4 }, { value: 3 }]
      - label: "Highlights"
        name: "highlights"
        widget: "list"
        required: false
        hint: "Optional bullet-point highlights shown on this competition's own page (e.g. 'Advanced through three preliminary rounds')."
        field: { label: "Highlight", name: "highlight", widget: "string" }
      - label: "More Photos"
        name: "extraPhotos"
        widget: "list"
        required: false
        hint: "Extra photos shown on this competition's own page."
        fields:
          - { label: "Photo", name: "image", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - label: "Articles"
        name: "articles"
        widget: "list"
        required: false
        hint: "Links to coverage of this competition"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }
          - { label: "Source", name: "source", widget: "string", required: false, hint: "e.g. the publication or site name" }
      - { label: "Description", name: "body", widget: "markdown", required: false, hint: "A short write-up of the event and its highlights. Shown on this competition's own page when someone clicks through from the Achievements list." }

  - name: "events"
    label: "Upcoming Events"
    label_singular: "Event"
    description: "Add upcoming events here. Move them to Past Events once they're done."
    folder: "src/events"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Event Name", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      # The text here is parsed to build the event's "Add to Calendar" entry,
      # so the format matters more than it used to. Anything unparseable still
      # produces a working button — it just becomes an all-day entry — and the
      # build prints a warning naming the event. See parseEventTime in
      # .eleventy.js.
      - { label: "Time", name: "time", widget: "string", required: false, hint: "e.g. 5:00 PM - 7:00 PM. Give a start and end time in this form so the 'Add to Calendar' button can set the right hours — if it can't read the time, the calendar entry covers the whole day instead." }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Allow RSVPs", name: "rsvp", widget: "boolean", required: false, default: true, hint: "Show an RSVP button on this event so visitors can let you know they're coming. Responses go to the RSVP Google Form set up under Page Content > Site Settings, and land in that form's response Sheet. If no form is set up yet, the button emails you instead." }
      - { label: "Photo", name: "photo", widget: "image", required: false, hint: "Upload a photo for this event" }
      - label: "Photo Fit"
        name: "photoSize"
        widget: "select"
        required: false
        default: "cover"
        hint: "Fill area (crop) or show the entire photo (may leave gaps)"
        options:
          - { label: "Fill area (crop to fit)", value: "cover" }
          - { label: "Show entire photo (may have gaps)", value: "contain" }
      - label: "Photo Focus (drag to position)"
        name: "photoPosition"
        widget: "focal-point"
        required: false
        default: "center"
        image_field: "photo"
        fitField: "photoSize"
        hint: "Drag the dot to choose what part of the photo stays in view."
        shapes:
          - label: "Upcoming event card"
            axes: [{ value: 1152 }, { value: 180 }]
            approx: true

  - name: "ghcup-winners"
    label: "GH Cup Previous Winners"
    label_singular: "GH Cup Year"
    description: "Add winners for each year of The GH Cup."
    folder: "src/ghcup-winners"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Year", name: "year", widget: "number", value_type: "int" }
      - { label: "Theme / Title", name: "theme", widget: "string", hint: "e.g. The GH Cup 2026" }
      - { label: "Case Title", name: "caseTitle", widget: "string", required: false, hint: "The case used for this year's competition" }
      - label: "Awards"
        name: "awards"
        widget: "list"
        hint: "Add each award (Winner, Runner-Up, Best Oral Advocate, Best Written, etc.)"
        fields:
          - { label: "Award Title", name: "title", widget: "string", hint: "e.g. Winner, Runner-Up, Best Oral Advocate" }
          - { label: "Recipients", name: "recipients", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image", required: false, hint: "Upload a photo from this year's GH Cup" }
      - label: "Photo Fit"
        name: "photoSize"
        widget: "select"
        required: false
        default: "cover"
        hint: "Fill area (crop) or show the entire photo (may leave gaps)"
        options:
          - { label: "Fill area (crop to fit)", value: "cover" }
          - { label: "Show entire photo (may have gaps)", value: "contain" }
      - { label: "Photo Zoom", name: "photoZoom", widget: "number", required: false, default: 1, value_type: "float", min: 1, max: 3, step: 0.1, hint: "1 = no zoom, 2 = zoom in 2x." }
      - label: "Photo Focus (drag to position)"
        name: "photoPosition"
        widget: "focal-point"
        required: false
        default: "center"
        image_field: "photo"
        fitField: "photoSize"
        zoomField: "photoZoom"
        hint: "Drag the dot to choose what part of the photo stays in view."
        shapes:
          - label: "Winner card"
            axes: [{ value: 280 }, { value: 220 }]
            approx: true

  - name: "ghcup-videos"
    label: "GH Cup Final Videos"
    label_singular: "Final Video"
    description: "Add videos of past GH Cup finals. They appear on the GH Cup page."
    folder: "src/ghcup-videos"
    create: true
    identifier_field: "year"
    slug: "ghcup-final-{{year}}"
    extension: "md"
    fields:
      - { label: "Year", name: "year", widget: "number", value_type: "int", hint: "Year of the final" }
      - { label: "Title", name: "title", widget: "string", required: false, hint: "e.g. 2025 GH Cup Final" }
      - { label: "YouTube URL", name: "url", widget: "string", hint: "Paste the full YouTube link, e.g. https://www.youtube.com/watch?v=XXXX" }
      - { label: "Short Description", name: "description", widget: "text", required: false }

  - name: "minimoot-winners"
    label: "Mini Moot Previous Winners"
    label_singular: "Mini Moot Year"
    description: "Add winners for each year of The Mini Moot — the internal, Guelph-Humber-only competition. Kept separate from GH Cup winners so the two competitions' results never get mixed up."
    folder: "src/minimoot-winners"
    create: true
    slug: "minimoot-{{year}}"
    fields:
      - { label: "Year", name: "year", widget: "number", value_type: "int" }
      - { label: "Theme / Title", name: "theme", widget: "string", hint: "e.g. The Mini Moot 2026" }
      - { label: "Case Title", name: "caseTitle", widget: "string", required: false, hint: "The case used for this year's competition" }
      - label: "Awards"
        name: "awards"
        widget: "list"
        hint: "Add each award (Winner, Runner-Up, Best Oral Advocate, Best Written, etc.)"
        fields:
          - { label: "Award Title", name: "title", widget: "string", hint: "e.g. Winner, Runner-Up, Best Oral Advocate" }
          - { label: "Recipients", name: "recipients", widget: "string" }
      - { label: "Photo", name: "photo", widget: "image", required: false, hint: "Upload a photo from this year's Mini Moot" }
      - label: "Photo Fit"
        name: "photoSize"
        widget: "select"
        required: false
        default: "cover"
        hint: "Fill area (crop) or show the entire photo (may leave gaps)"
        options:
          - { label: "Fill area (crop to fit)", value: "cover" }
          - { label: "Show entire photo (may have gaps)", value: "contain" }
      - { label: "Photo Zoom", name: "photoZoom", widget: "number", required: false, default: 1, value_type: "float", min: 1, max: 3, step: 0.1, hint: "1 = no zoom, 2 = zoom in 2x." }
      - label: "Photo Focus (drag to position)"
        name: "photoPosition"
        widget: "focal-point"
        required: false
        default: "center"
        image_field: "photo"
        fitField: "photoSize"
        zoomField: "photoZoom"
        hint: "Drag the dot to choose what part of the photo stays in view."
        shapes:
          - label: "Winner card"
            axes: [{ value: 280 }, { value: 220 }]
            approx: true

  - name: "minimoot-videos"
    label: "Mini Moot Final Videos"
    label_singular: "Final Video"
    description: "Add videos of past Mini Moot finals. They appear on the Mini Moot page."
    folder: "src/minimoot-videos"
    create: true
    identifier_field: "year"
    slug: "minimoot-final-{{year}}"
    extension: "md"
    fields:
      - { label: "Year", name: "year", widget: "number", value_type: "int", hint: "Year of the final" }
      - { label: "Title", name: "title", widget: "string", required: false, hint: "e.g. 2025 Mini Moot Final" }
      - { label: "YouTube URL", name: "url", widget: "string", hint: "Paste the full YouTube link, e.g. https://www.youtube.com/watch?v=XXXX" }
      - { label: "Short Description", name: "description", widget: "text", required: false }

  - name: "past-events"
    label: "Past Events"
    label_singular: "Past Event"
    description: "Record of past events. You can add photos from the event."
    folder: "src/past-events"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Event Name", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Photo", name: "photo", widget: "image", required: false, hint: "Upload a photo from this event" }
      - label: "Photo Fit"
        name: "photoSize"
        widget: "select"
        required: false
        default: "cover"
        hint: "Fill area (crop) or show the entire photo (may leave gaps)"
        options:
          - { label: "Fill area (crop to fit)", value: "cover" }
          - { label: "Show entire photo (may have gaps)", value: "contain" }
      - label: "Photo Focus (drag to position)"
        name: "photoPosition"
        widget: "focal-point"
        required: false
        default: "center"
        image_field: "photo"
        fitField: "photoSize"
        hint: "Drag the dot to choose what part of the photo stays in view."
        shapes:
          - label: "Past event card"
            axes: [{ value: 564 }, { value: 200 }]
      - label: "Extra Photos"
        name: "extraPhotos"
        widget: "list"
        required: false
        hint: "Add more photos from this event"
        fields:
          - { label: "Photo", name: "image", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string", required: false }

  - name: "photos"
    label: "Photo Gallery"
    label_singular: "Photo"
    description: "Upload photos to the gallery. They show up on the Photo Gallery page."
    folder: "src/photos"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { label: "Title / Caption", name: "title", widget: "string", hint: "A short caption for the photo" }
      - { label: "Description", name: "description", widget: "text", required: false, hint: "A sentence or two giving visitors context for the photo. Shown when the photo is opened." }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "Category", name: "category", widget: "select", options: ["Competition", "Event", "Social", "Other"], required: false }
      - label: "Photo Focus (drag to position)"
        name: "photoPosition"
        widget: "focal-point"
        required: false
        default: "center"
        image_field: "image"
        hint: "Drag the dot to choose what part of the photo stays in view in the gallery grid."
        shapes:
          - label: "Gallery grid cell"
            axes:
              - { by: "size", values: { normal: 1, wide: 2, tall: 1, large: 2 }, default: 1 }
              - { by: "size", values: { normal: 1, wide: 1, tall: 2, large: 2 }, default: 1 }
      - label: "Photo Size in Gallery"
        name: "size"
        widget: "select"
        required: false
        hint: "How big this photo appears in the gallery"
        options:
          - { label: "Normal", value: "normal" }
          - { label: "Wide (spans 2 columns)", value: "wide" }
          - { label: "Tall (spans 2 rows)", value: "tall" }
          - { label: "Large (spans 2x2)", value: "large" }

  - name: "team"
    label: "Executive Team"
    label_singular: "Team Member"
    description: "Add or update exec team members. They appear on the About page carousel and each gets their own profile page. Competitions attended, team placements, and individual achievements fill themselves in from the Achievements collection — tag this person there as a Competitor or Recipient and they show up here on their own. Filling in one of those three lists by hand takes that section over completely, so you can curate exactly what your profile shows; leave a section empty to let it keep filling itself in."
    folder: "src/team"
    create: true
    slug: "{{name}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role / Title", name: "role", widget: "string", hint: "e.g. President, Vice President" }
      - { label: "Previous Role", name: "previousRole", widget: "string", required: false, hint: "A role this exec held before their current one, if applicable" }
      - { label: "Graduating Year", name: "gradYear", widget: "number", value_type: "int", required: false, hint: "e.g. 2027" }
      - { label: "Biography", name: "bio", widget: "text", required: false, hint: "Written by each executive. Include things like how long you've been in your role, how long you've been mooting, and your passion for law." }
      - label: "Q&A"
        name: "qanda"
        widget: "list"
        required: false
        hint: "Optional short Q&A shown on this exec's profile page, e.g. 'Why did you join GHPLS?'"
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }
      - label: "Competitions Attended"
        name: "competitions"
        widget: "list"
        required: false
        label_singular: "Competition"
        collapsed: false
        hint: "Leave this empty and the list fills itself in from every Achievement you're tagged in. Add even one entry here and this becomes the whole list instead — use that to choose exactly which competitions your profile shows. Names that match an achievement still link to it."
        fields:
          - { label: "Competition Name", name: "competition", widget: "string", hint: "e.g. HSFK Cup" }
          - { label: "Year", name: "year", widget: "number", value_type: "int", required: false }
      - label: "Team Placements"
        name: "teamPlacements"
        widget: "list"
        required: false
        label_singular: "Team Placement"
        collapsed: false
        hint: "How far a team got — Champions, Finalists, Semi-Finalists. Same rule as above: empty fills itself in automatically, anything you add here becomes the whole list."
        fields:
          - { label: "Award / Placement", name: "award", widget: "string", hint: "e.g. Finalists, Semi-Finalists" }
          - { label: "Competition Name", name: "competition", widget: "string" }
          - { label: "Year", name: "year", widget: "number", value_type: "int", required: false }
      - label: "Individual Achievements"
        name: "individualAchievements"
        widget: "list"
        required: false
        label_singular: "Individual Achievement"
        collapsed: false
        hint: "A named award, e.g. Best Oral Advocate or Best Skeleton Arguments — including ones shared with a teammate. Same rule again: empty fills itself in, anything you add becomes the whole list."
        fields:
          - { label: "Award", name: "award", widget: "string", hint: "e.g. Best Oral Advocate, 3rd Place Factum" }
          - { label: "Competition Name", name: "competition", widget: "string" }
          - { label: "Year", name: "year", widget: "number", value_type: "int", required: false }
      - { label: "Ignore automatic matches", name: "manualOnly", widget: "boolean", required: false, default: false, hint: "Leave this off. Turn it on only if the automatic pull from Achievements is showing something wrong for this person — then the three lists above become the only thing shown on their profile." }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", hint: "1 = shown first, 2 = second, etc." }
      - { label: "Photo", name: "photo", widget: "image", required: false, hint: "Upload a headshot" }
      - label: "Photo Focus (drag to position)"
        name: "photoPosition"
        widget: "focal-point"
        required: false
        default: "center"
        image_field: "photo"
        hint: "Drag the dot onto the face so it isn't cut off in the round headshot."
        shapes:
          - label: "Carousel & profile headshot (circular)"
            shape: "circle"
            axes: [{ value: 1 }, { value: 1 }]
          - label: "Profile page banner"
            axes: [{ value: 1600 }, { value: 380 }]
            overlay: "navy"
            approx: true
      - label: "Header Photo (optional — overrides the page banner)"
        name: "headerPhoto"
        widget: "image"
        required: false
        hint: "By default your profile page banner reuses your headshot above, stretched wide. Leave this blank to keep that. Upload a different photo here if you'd rather the banner show something else instead — a wider action shot usually reads better stretched across the banner than a close-up headshot crop."
      - label: "Header Photo Focus (drag to position)"
        name: "headerPhotoPosition"
        widget: "focal-point"
        required: false
        default: "center"
        image_field: "headerPhoto"
        hint: "Only applies if a Header Photo above is set."
        shapes:
          - label: "Profile page banner"
            axes: [{ value: 1600 }, { value: 380 }]
            overlay: "navy"
            approx: true
      - label: "More Photos"
        name: "extraPhotos"
        widget: "list"
        required: false
        hint: "Extra photos shown on this exec's own profile page"
        fields:
          - { label: "Photo", name: "image", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string", required: false }

  - name: "pages"
    label: "Page Content"
    description: "Edit the text content on each page."
    files:
      - label: "Site Settings"
        name: "site-settings"
        file: "src/_data/site.json"
        fields:
          - { label: "Site Title", name: "title", widget: "string" }
          - { label: "Short Title (nav bar)", name: "shortTitle", widget: "string" }
          - { label: "Site Description", name: "description", widget: "text", hint: "Shows on the homepage and footer" }
          - { label: "Instagram URL", name: "instagram", widget: "string" }
          - { label: "LinkedIn URL", name: "linkedin", widget: "string" }
          - { label: "Contact Email", name: "email", widget: "string", required: false }
          - { label: "RSVP Google Form link", name: "rsvpFormUrl", widget: "string", required: false, hint: "Paste the 'Send > link' URL of your RSVP Google Form. Leave blank and the RSVP button emails you instead, so it never breaks." }
          - { label: "RSVP form — event field ID", name: "rsvpFormEventField", widget: "string", required: false, hint: "Optional. Lets the form open with the event name already filled in. In your Google Form choose 'Get pre-filled link', type ANYTHING into the event question, click Get link, and copy the entry.123456789 part of the URL here." }
          - { label: "Contact Google Form link", name: "contactFormUrl", widget: "string", required: false, hint: "Paste the 'Send > link' URL of your contact Google Form. Leave blank and the Contact page just shows your email and socials." }

      - label: "About Page"
        name: "about-page"
        file: "src/_data/about.json"
        fields:
          - { label: "Mission Statement", name: "mission", widget: "text", hint: "The main mission paragraph at the top of the About page" }
          - { label: "Advocacy & Mooting Description", name: "advocacy", widget: "text" }
          - { label: "Community Description", name: "community", widget: "text" }
          - { label: "Education Description", name: "education", widget: "text" }
          - label: "FAQ"
            name: "faq"
            widget: "list"
            hint: "Add, edit, or reorder frequently asked questions"
            fields:
